name: Fetch school menus

on:
  schedule:
    # 1am PDT Mon-Fri (08:00 UTC)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Allow manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for the keepalive commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Write config
        run: echo "$MSM_CONFIG" > config.toml
        env:
          MSM_CONFIG: ${{ secrets.MSM_CONFIG }}

      - name: Fetch and push
        run: python bin/fetch
        env:
          TRMNL_PLUGIN_UUID: ${{ secrets.TRMNL_PLUGIN_UUID }}

      # Scheduled workflows are disabled after 60 days of repo inactivity.
      # Push an empty commit only when the last commit is 50+ days old.
      - name: Keepalive
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: prevent scheduled workflow disable"
            git push
          else
            echo "Last commit is $age_days days old; keepalive not needed yet."
          fi
